# Overlay: federated learning experiment (Phase 5) — the isolated / federated
# / pooled comparison across simulated institutions.

federated:
  num_clients: 4
  clients_per_round_fraction: 1.0
  num_rounds: 20
  local_epochs: 1
  strategy: "fedprox"
  fedprox_mu: 0.01
  boundary_exchange_every_n_rounds: 1
  secure_aggregation: false

privacy:
  dp_enabled: true
  target_epsilon: 8.0
  target_delta: 0.00001
  gradient_clip_norm: 1.0
  noise_multiplier: 1.1

data:
  dataset_name: "ibm_aml"
  split:
    strategy: "temporal"
  # Institution partitioning for the federated experiment is a separate
  # concern from the train/test split above (see src/ledger/federated/
  # partitioning.py, Phase 5.1) — it splits accounts across simulated
  # banks, not time steps.
