[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
description = "LEDGER: temporal-graph anti-money-laundering detection platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "pandera>=0.18",
    "networkx>=3.2",
    "joblib>=1.3",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "flwr>=1.8",
    "matplotlib>=3.8",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.1",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "types-PyYAML>=6.0",
    "types-networkx>=3.2",
    "pandas-stubs>=2.2",
]

[project.scripts]
ledger = "ledger.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ledger"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# torch, torch_geometric, and sklearn are only required by the optional
# "ml" extra; keep them optional for typechecking too so `make typecheck`
# works without a heavy ML install.
module = ["torch.*", "torch_geometric.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ledger --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["src/ledger"]
branch = true
